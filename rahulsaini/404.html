<html lang="en">
<head>

  <style>
    :root { --bg: #07080b; --text: #eef1f6; --muted: #a1a9b6; --border: rgba(255,255,255,.16); --a1: #5eead4; --a2: #a78bfa; color-scheme: dark; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f6f2; --text: #0e1218; --muted: #4d5663; --border: rgba(15,20,30,.18); --a1: #0d9488; --a2: #7c3aed; color-scheme: light; }
    }
    * { margin: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
           font: 16px/1.6 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    .code { font: 700 clamp(5rem, 22vw, 9rem)/1 'Space Grotesk', system-ui, sans-serif; letter-spacing: -.06em;
            background: linear-gradient(110deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 1.4rem; margin: 12px 0 6px; }
    p { color: var(--muted); }
    a { display: inline-block; margin-top: 24px; padding: 12px 22px; border: 1px solid var(--border); border-radius: 999px; color: var(--text); text-decoration: none; }
    a:hover { border-color: var(--a1); }
  </style>
</head>
