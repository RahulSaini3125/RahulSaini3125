worker_processes 1;   # static site on a small server: one worker is plenty (auto would count all host CPUs)
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    open_file_cache max=100 inactive=60s;
    open_file_cache_valid 120s;

    # Compression: serve pre-built .gz files (see Dockerfile), fall back to on-the-fly gzip
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Caching per file type. Set via one map so no location needs its own add_header —
    # in nginx, an add_header inside a location drops every header set above it.
    #   css/js:  versioned with ?v=N in index.html, so safe to cache forever
    #   images:  not versioned, so cache for a week and revalidate
    #   html:    always revalidate so new versions show up immediately
    map $uri $cache_control {
        default                                       "no-cache";
        ~*\.(?:css|js)$                               "public, max-age=31536000, immutable";
        ~*\.(?:svg|png|jpe?g|gif|webp|avif|ico)$      "public, max-age=604800, must-revalidate";
        ~*\.(?:woff2?|ttf|otf)$                       "public, max-age=31536000, immutable";
    }

    # Bare domain → www (Nginx Proxy Manager terminates HTTPS and forwards the Host header)
    server {
        listen 80;
        listen [::]:80;
        server_name officialrahulsaini.in;
        return 301 https://www.officialrahulsaini.in$request_uri;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name www.officialrahulsaini.in localhost;

        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
            access_log off;
            try_files $uri =404;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        error_page 404 /index.html;
    }
}
