worker_processes 1;   # static site on a small server: one worker is plenty (auto would count all host CPUs)
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    open_file_cache max=100 inactive=60s;
    open_file_cache_valid 120s;

    # Compression: serve pre-built .gz files (see Dockerfile), fall back to on-the-fly gzip
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Caching per file type. Set via one map so no location needs its own add_header —
    # in nginx, an add_header inside a location drops every header set above it.
    #   data.js: the content file — always revalidate, so edits show up even if ?v= isn't bumped
    #   css/js:  versioned with ?v=N in index.html, so safe to cache forever
    #   images, video: not versioned, so cache for a week and revalidate
    #   html, robots.txt, sitemap.xml, llms.txt: always revalidate
    # (regexes are checked in order, so data.js must stay above the css/js rule)
    map $uri $cache_control {
        default                                       "no-cache";
        ~*/data\.js$                                  "no-cache";
        ~*\.(?:css|js)$                               "public, max-age=31536000, immutable";
        ~*\.(?:svg|png|jpe?g|gif|webp|avif|ico|mp4|webm)$ "public, max-age=604800, must-revalidate";
        ~*\.(?:woff2?|ttf|otf)$                       "public, max-age=31536000, immutable";
    }

    # Bare domain → www (Nginx Proxy Manager terminates HTTPS and forwards the Host header)
    server {
        listen 80;
        listen [::]:80;
        server_name officialrahulsaini.in;
        return 301 https://www.officialrahulsaini.in$request_uri;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name www.officialrahulsaini.in localhost;

        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # HTTPS is terminated by Nginx Proxy Manager; browsers only honour this header over HTTPS
        add_header Strict-Transport-Security "max-age=31536000" always;
        # The sha256 allows the inline theme script in index.html. If that script changes, the Docker
        # build fails (tools/prerender checks it) and prints the new hash to paste here.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ZesNnednrDXN2vWDHxL8K9CVdF6mgOLYdgR5JW8pQAA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
            access_log off;
            try_files $uri =404;
        }

        # Intro videos are only served to the site's own player: opening the file URL directly (no
        # Referer) or embedding it on another site gets a 403. A deterrent against casual downloads,
        # not DRM. Posters stay public so search engines can fetch the thumbnail.
        location ~* ^/assets/video/.+\.(?:mp4|webm)$ {
            valid_referers server_names www.officialrahulsaini.in localhost;
            if ($invalid_referer) { return 403; }
            access_log off;
            try_files $uri =404;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
